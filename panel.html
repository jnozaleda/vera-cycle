<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel · Hera</title>
<link rel="icon" href="app/icons/favicon-32.png">
<style>
  :root { --plum: #6B3D57; --plum-soft: #F3EAF0; --ink: #2C2C2A; --soft: #6E6A66; --line: #E7E0E4; --bg: #FBF9F7; --ok: #3F584B; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-family: Georgia, serif; font-weight: 400; color: var(--plum); font-size: 30px; margin: 0; }
  h2 { font-size: 15px; font-weight: 600; color: var(--plum); margin: 0 0 10px; }
  .sub { color: var(--soft); font-size: 13px; margin: 2px 0 20px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
  button, input { font: inherit; }
  .seg button { border: 1px solid var(--line); background: #fff; padding: 6px 12px; border-radius: 999px; cursor: pointer; color: var(--ink); }
  .seg button.on { background: var(--plum); color: #fff; border-color: var(--plum); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; }
  .kpi .v { font-size: 28px; font-weight: 600; color: var(--plum); line-height: 1.1; }
  .kpi .l { font-size: 12.5px; color: var(--soft); }
  .row { display: grid; grid-template-columns: 130px 1fr 44px; gap: 10px; align-items: center; font-size: 13.5px; margin: 6px 0; }
  .track { background: var(--plum-soft); border-radius: 6px; height: 12px; overflow: hidden; }
  .fill { background: var(--plum); height: 100%; border-radius: 6px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .chart { display: flex; align-items: flex-end; gap: 3px; height: 140px; padding-top: 8px; }
  .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 2px; min-width: 0; }
  .col i { display: block; width: 100%; background: var(--plum); border-radius: 3px 3px 0 0; min-height: 1px; }
  .col i.b { background: var(--ok); }
  .xl { display: flex; gap: 3px; font-size: 10px; color: var(--soft); }
  .xl span { flex: 1; text-align: center; overflow: hidden; }
  .legend { font-size: 12px; color: var(--soft); display: flex; gap: 14px; margin-top: 6px; }
  .legend b { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .login { max-width: 360px; margin: 12vh auto; }
  .login input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 12px; margin: 10px 0; background: #fff; }
  .login button, .primary { width: 100%; padding: 12px; border: 0; border-radius: 12px; background: var(--plum); color: #fff; font-weight: 600; cursor: pointer; }
  .err { color: #A3324A; font-size: 13px; }
  .note { font-size: 12px; color: var(--soft); }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .linkish { background: none; border: 0; color: var(--soft); text-decoration: underline; cursor: pointer; font-size: 12px; padding: 0; }
</style>
</head>
<body>
<main id="app"></main>
<script>
const API = 'https://hera-consultas.tempcheck-app.workers.dev';
const KEY = 'hera-panel-code';
const $ = (h) => { document.getElementById('app').innerHTML = h; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let days = 30;
const code = () => { try { return localStorage.getItem(KEY) || ''; } catch { return ''; } };

function login(msg = '') {
  $(`<div class="login card"><h1>Hera</h1><p class="sub">Panel de uso. Escribe el código de acceso.</p>
    <form id="f"><input id="c" type="password" autocomplete="current-password" placeholder="Código de acceso" required>
    ${msg ? `<p class="err">${esc(msg)}</p>` : ''}<button>Entrar</button></form></div>`);
  document.getElementById('f').onsubmit = (e) => { e.preventDefault(); try { localStorage.setItem(KEY, document.getElementById('c').value.trim()); } catch {} load(); };
}

async function load() {
  if (!code()) return login();
  $('<p class="sub">Cargando…</p>');
  let res;
  try { res = await fetch(`${API}/stats?days=${days}`, { headers: { Authorization: `Bearer ${code()}` } }); }
  catch { return $('<p class="err">No se ha podido conectar. Inténtalo de nuevo.</p>'); }
  if (res.status === 401) { try { localStorage.removeItem(KEY); } catch {} return login('Código incorrecto.'); }
  render(await res.json());
}

function render(data) {
  const byDay = {}; const tot = {};
  for (const r of data.rows) { (byDay[r.day] ||= {})[r.k] = r.n; tot[r.k] = (tot[r.k] || 0) + r.n; }
  const g = (k) => tot[k] || 0;
  const consultas = g('consulta:gineco') + g('consulta:matrona') + g('consulta:pediatra');
  const list = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000);
    list.push(new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Madrid' }).format(d));
  }
  const maxP = Math.max(1, ...list.map((d) => (byDay[d]?.personas_app || 0)));
  const maxC = Math.max(1, ...list.map((d) => ['gineco', 'matrona', 'pediatra'].reduce((a, p) => a + (byDay[d]?.[`consulta:${p}`] || 0), 0)));
  const bars = (items) => { const m = Math.max(1, ...items.map((x) => x[1])); return items.map(([l, v]) => `<div class="row"><span>${esc(l)}</span><div class="track"><div class="fill" style="width:${(v / m) * 100}%"></div></div><span class="num">${v}</span></div>`).join(''); };
  const kpi = (v, l) => `<div class="card kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  const label = (d) => `${+d.slice(8)}/${+d.slice(5, 7)}`;
  const step = Math.ceil(days / 10);
  $(`<h1>Hera · uso</h1>
  <p class="sub">Del ${esc(label(data.from))} al ${esc(label(data.to))} · datos anónimos, sin cookies</p>
  <div class="bar"><div class="seg">${[7, 30, 90].map((n) => `<button data-d="${n}" class="${n === days ? 'on' : ''}">${n} días</button>`).join(' ')}</div>
    <button class="linkish" id="out">Salir</button></div>
  <div class="grid">
    ${kpi(g('personas_app'), 'Personas en la app<br>(suma de cada día)')}
    ${kpi(g('apertura'), 'Aperturas de la app')}
    ${kpi(g('personas_portada'), 'Visitas a la portada<br>(personas por día)')}
    ${kpi(consultas, 'Consultas enviadas')}
    ${kpi(g('gratuitas_agotadas'), 'Intentos con las<br>gratuitas agotadas')}
    ${kpi(g('aviso_pago'), 'Piden aviso de<br>consultas de pago')}
  </div>
  <div class="card"><h2>Personas y consultas por día</h2>
    <div class="chart">${list.map((d) => { const p = byDay[d]?.personas_app || 0; const c = ['gineco', 'matrona', 'pediatra'].reduce((a, x) => a + (byDay[d]?.[`consulta:${x}`] || 0), 0);
      return `<div class="col" title="${label(d)}: ${p} personas, ${c} consultas"><i style="height:${(p / maxP) * 100}px"></i><i class="b" style="height:${(c / maxC) * 30}px"></i></div>`; }).join('')}</div>
    <div class="xl">${list.map((d, i) => `<span>${i % step === 0 ? label(d) : ''}</span>`).join('')}</div>
    <div class="legend"><span><b style="background:var(--plum)"></b>Personas</span><span><b style="background:var(--ok)"></b>Consultas</span></div></div>
  <div class="two">
    <div class="card"><h2>Consultas por profesional</h2>${bars([['Gonzalo', g('consulta:gineco')], ['Marina', g('consulta:matrona')], ['Lucía', g('consulta:pediatra')]])}
      <p class="note">Hojas de consulta abiertas: ${g('consulta_abierta')}${g('consulta_abierta') ? ` · enviadas: ${Math.round((consultas / g('consulta_abierta')) * 100)} %` : ''}</p></div>
    <div class="card"><h2>Etapa de quien abre la app</h2>${bars([['Embarazo', g('etapa:pregnancy')], ['Posparto', g('etapa:postpartum')], ['Ciclo', g('etapa:cycle')]])}</div>
    <div class="card"><h2>Pestañas visitadas</h2>${bars([['Diario', g('pestana:diary')], ['Cuidados', g('pestana:care')], ['Dudas', g('pestana:guide')], ['Hoy', g('pestana:today')], ['Ciclo', g('pestana:cycle')], ['Patrones', g('pestana:trends')]])}
      <p class="note">Hoy es la pantalla de entrada: solo cuenta cuando se vuelve a ella.</p></div>
    <div class="card"><h2>Desde la portada</h2>${bars([['Visitas', g('portada')], ['Pulsan «Pregunta tu duda»', g('pregunta_portada')], ['Pulsan «Abre Hera»', g('abrir_portada')]])}</div>
    <div class="card"><h2>Otras acciones</h2>${bars([['Vista «Tu bebé»', g('vista:bebe')], ['Avisos activados', g('push_on')], ['Google conectado', g('sync_on')]])}</div>
  </div>
  <p class="note">«Personas» es una aproximación: se cuenta una vez al día por conexión y navegador, con una huella que cambia cada día y se borra a las 48 h. Sumar días cuenta a la misma persona varias veces.</p>`);
  document.querySelectorAll('[data-d]').forEach((b) => { b.onclick = () => { days = +b.dataset.d; load(); }; });
  document.getElementById('out').onclick = () => { try { localStorage.removeItem(KEY); } catch {} login(); };
}
load();
</script>
</body>
</html>
